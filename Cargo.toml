[workspace]
resolver = "3"
members = ["crates/orbit", "crates/rigctld-client", "crates/rig-tui", "crates/sat-tui", "crates/logbook", "crates/hamtools-tui", "crates/hamtools-config"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.89"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
