# Copy to ~/.config/hamtools/sat-tui.toml (or pass --config PATH).

# NORAD ids to show. Empty or absent: every satellite with a usable transmitter.
# 25544 = ISS, 27607 = SO-50, 44909 = RS-44
# watch = [25544, 27607, 44909]

[rig]
# The FT-847's rigctld (hamlib model 1001).
addr = "127.0.0.1:4533"

[passes]
horizon_hours = 24
min_elevation_deg = 10.0
# Passes shorter than this (seconds) are marked with ! in the list.
short_pass_secs = 180

[observer]
# Position order: --grid/--lat/--lon, then this section, then station.locator in the shared
# config.toml, then a town-level default.
# Either a Maidenhead grid (4 or 6 characters) or lat/lon, not both.
grid = "EN71"
# lat_deg = 41.67
# lon_deg = -85.71
alt_m = 250.0

# Contact logging (untested on hardware). The callsign comes from `callsign` in the shared
# ~/.config/hamtools/config.toml; without it logging stays off. The Log path is also there
# (`[logbook] path`, shared with rig-tui); --log PATH wins.
[logbook]
# Your own 6-character grid, used verbatim instead of the one derived from [observer].
# grid = "EN71DQ"

# SAT_NAME to write, per satellite name as shown in the UI.
# [logbook.satellites]
# "ISS (ZARYA)" = "ISS"
