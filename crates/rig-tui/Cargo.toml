[package]
name = "rig-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
ratatui = "0.30.2"
hamtools-config = { path = "../hamtools-config" }
rigctld-client = { path = "../rigctld-client" }
hamtools-tui = { path = "../hamtools-tui" }
logbook = { path = "../logbook" }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time"] }
ureq = "3.5.0"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "sync"] }
