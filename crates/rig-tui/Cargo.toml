[package]
name = "rig-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
ratatui = "0.30.2"
hamtools-config = { path = "../hamtools-config" }
rigctld-client = { path = "../rigctld-client" }
hamtools-tui = { path = "../hamtools-tui" }
logbook = { path = "../logbook" }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt", "net", "time"] }
# One HTTPS GET to Nominatim (address -> Locator in the config dialog); a blocking client on a
# short-lived thread, with no async runtime or reqwest/hyper stack. TLS is needed for https; gzip
# is not (small JSON), so only the `rustls` feature is kept.
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }

[dev-dependencies]
sat-tui = { path = "../sat-tui" }
orbit = { path = "../orbit" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "sync"] }
