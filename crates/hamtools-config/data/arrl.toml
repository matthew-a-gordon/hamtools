# embedding more. Conventions, not rules; locally coordinated plans take precedence.
#
# `mode` is the usual rig mode the `m` key applies: CW, USB, LSB, FM, RTTY, or `phone`
# (LSB below 10 MHz, USB above). Rows without it have no usual mode. A row with lo_hz == hi_hz
# is a calling frequency.
