# FCC privilege layer (47 CFR 97.301, Region 2). Integer Hz. One row per range over which the
# set of license classes is the same, so rows never overlap.
#
# Transcribed from a research note (2026-11-04), NOT yet re-read from the live eCFR. Verify
# against the current rules and the operator's own license before relying on any row. Band
# edges only: emission types and power limits are deliberately not encoded.
#
# x = extra, a = advanced, g = general, t = technician, n = novice.

