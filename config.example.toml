# Copy to ~/.config/hamtools/config.toml (or pass --config PATH).

# Your callsign. Typing {call} in kx3-cw expands to it when you send.
callsign = "N0CALL"

[kx3]
# The KX3's rigctld (see CLAUDE.md for the command).
addr = "127.0.0.1:4532"

# Function-key macros, F1 to F6. Text is sent as CW when you press the key.
# {call} expands to the callsign above.
[macros]
F1 = "CQ CQ CQ DE {call} {call} K"
F2 = "{call}"
F3 = "R R 73 TU DE {call} SK"
