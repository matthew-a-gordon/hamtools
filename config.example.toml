# Copy to ~/.config/hamtools/config.toml (or pass --config PATH).
# Shared by the hamtools apps; keys an app does not know are kept and reported as warnings.

# Your callsign. Typing {MYCALL} in rig-tui expands to it when you send.
callsign = "N0CALL"

# Where you are, as a 6-character Locator (never latitude/longitude). Town-level only; example:
# Middlebury, IN. rig-tui uses it to fill own_grid when logging and, in the Satellite Activity, as the observer position.
# [station]
# locator = "EN71DQ"

# The shared ADIF Log. Omit it to use $XDG_DATA_HOME/hamtools/log.adi
# (~/.local/share/hamtools/log.adi).
# [logbook]
# path = "/home/you/.local/share/hamtools/log.adi"

# Where plan exports (POTA ADIF, SOTA CSV) are written, from E in the plan manager (Ctrl-G,
# Activation plans). Files go only here and are never uploaded. Default: ~/hamtools-exports/
# [export]
# dir = "/home/you/hamtools-exports"

# Rigs are named profiles, each with the address of its rigctld (see CLAUDE.md for the
# commands) and a kind: "kx3", "ft847" or "generic". Both rigs stay connected; Ctrl-R switches.
# The old single `[rig] addr` and `[kx3]` keys are no longer read and are rejected.
[rig]
# The profile to start on. Omit it to start on the first one.
default = "kx3"

[rig.kx3]
addr = "127.0.0.1:4532"
kind = "kx3"

[rig.ft847]
addr = "127.0.0.1:4533"
kind = "ft847"
# Capabilities come from a built-in table for the kind; a profile may override any of these
# three (the table's rows are labelled "untested on hardware" in Ctrl-R until verified):
# cw = true
# split = true
# sat_mode = true

# The Satellite Activity (Ctrl-G, then Satellite; needs a rig with sat mode, the FT-847).
# Untested on hardware. Every key is optional; these are the defaults. Your position comes from
# --grid or --lat/--lon, then station.locator above, then a town-level default.
# [satellite]
# watch = [25544, 27607, 44909]   # NORAD ids to show; empty: every satellite with a usable transmitter
# horizon_hours = 24              # how far ahead the pass list looks (1 to 168)
# min_elevation_deg = 10          # a pass counts only if it climbs this high (0 to 90)
# short_pass_secs = 180           # passes shorter than this are marked with !
# [satellite.names]               # name shown in the UI = name written to the Log as SAT_NAME
# "ISS (ZARYA)" = "ISS"

# Soft keys F1 to F6 (CW and CWR only). Text is sent as CW when you press the key.
# {MYCALL} expands to the callsign above; {THEIRCALL} and {MYRST} come from the Contact form.
[macros]
F1 = "CQ CQ DE {MYCALL} {MYCALL} K"
F2 = "{THEIRCALL} DE {MYCALL} UR {MYRST} {MYRST} K"
F3 = "{THEIRCALL} TU 73 DE {MYCALL} EE"
F4 = "QRZ? DE {MYCALL}"
F5 = "PSE UR CALL AGN K"
F6 = "QRL?"
